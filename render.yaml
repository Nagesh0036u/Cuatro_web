# Render Blueprint for the Cuatro Tech Solutions website.
# Free plan = demo only: the database and uploaded resumes are wiped on every restart/redeploy.
# For real use, switch to a paid plan and uncomment the "disk" block so data survives restarts.
services:
  - type: web
    name: cuatro-tech-solutions
    runtime: node
    plan: free            # change to "starter" when you enable the disk below
    buildCommand: npm ci --omit=dev
    startCommand: npm run setup && npm start
    healthCheckPath: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_DEMO_JOBS
        value: "true"     # demonstration jobs; set to "false" for real use
      - key: ADMIN_EMAIL
        sync: false       # you type this in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false       # you type this in the Render dashboard (never put it in the repo)
      - key: ADMIN_SYNC_FROM_ENV
        value: "true"     # admin login always matches ADMIN_EMAIL / ADMIN_PASSWORD set in Render
      - key: ADMIN_NAME
        value: Cuatro Administrator
      # --- E-mail (needed for sign-up codes and password reset links) ---
      # Render free blocks SMTP ports, so use the Brevo HTTP API key here (brevo.com > SMTP & API > API keys).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false       # e.g. Cuatro Tech Solutions <your-verified-sender@gmail.com>
    # --- Persistent storage (paid plans only). Uncomment, and also set plan: starter above. ---
    # disk:
    #   name: cuatro-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add these two env vars:
    #   DATABASE_PATH=/var/data/cuatro.sqlite
    #   RESUME_DIR=/var/data/resumes
